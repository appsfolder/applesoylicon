[package]
name = "applesoylicon"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
description = "A playful Matrix-rain terminal screensaver"
license = "MIT"
repository = "https://github.com/appsfolder/applesoylicon"
keywords = ["terminal", "screensaver", "matrix", "animation"]
